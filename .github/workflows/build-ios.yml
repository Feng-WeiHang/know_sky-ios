name: Build iOS IPA (unsigned)

# 每次推送到 main 分支或手动触发时，在云端 macOS 上构建识天 iOS 版
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  build:
    name: 构建未签名 IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: 安装 XcodeGen（brew 失败则回退官方二进制）
        run: |
          if ! brew install xcodegen; then
            echo "brew 安装失败，改用 GitHub Release 二进制"
            curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q xcodegen.zip -d /tmp/xcodegen-dist
            echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
          fi

      - name: 生成 Xcode 工程
        run: |
          xcodegen --version
          xcodegen generate
          xcodebuild -list -project SkySense.xcodeproj

      - name: 编译归档（跳过签名）
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project SkySense.xcodeproj \
            -scheme SkySense \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SkySense.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" 2>&1 | tee build/xcodebuild.log
          # 校验归档产物确实存在
          test -d build/SkySense.xcarchive/Products/Applications/SkySense.app

      - name: 提取编译错误为注释（仅失败时）
        if: failure()
        run: |
          if [ -f build/xcodebuild.log ]; then
            grep -E "(error|fatal error):" build/xcodebuild.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: 上传编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: 打包为未签名 IPA
        run: |
          mkdir -p build/Payload
          cp -R build/SkySense.xcarchive/Products/Applications/SkySense.app build/Payload/
          cd build
          zip -qry SkySense-unsigned.ipa Payload
          ls -lh SkySense-unsigned.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SkySense-unsigned-ipa
          path: build/SkySense-unsigned.ipa
          retention-days: 30

      - name: 上传 xcarchive（备用，供本地签名）
        uses: actions/upload-artifact@v4
        with:
          name: SkySense-xcarchive
          path: build/SkySense.xcarchive
          retention-days: 30

      - name: 编译模拟器版（供 Appetize.io 浏览器云端预览）
        run: |
          set -o pipefail
          xcodebuild build \
            -project SkySense.xcodeproj \
            -scheme SkySense \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" 2>&1 | tee build/xcodebuild-sim.log
          test -d build/sim/Build/Products/Release-iphonesimulator/SkySense.app
          cd build/sim/Build/Products/Release-iphonesimulator
          zip -qry ../../../../SkySense-simulator.zip SkySense.app
          cd ../../../..
          ls -lh SkySense-simulator.zip

      - name: 上传模拟器包（直接上传 appetize.io 即可在浏览器运行）
        uses: actions/upload-artifact@v4
        with:
          name: SkySense-simulator-app
          path: build/SkySense-simulator.zip
          retention-days: 30
