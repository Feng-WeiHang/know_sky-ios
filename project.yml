# 识天 SkySense - XcodeGen 工程描述文件
# 在 macOS 上执行: brew install xcodegen && xcodegen generate
# 生成 SkySense.xcodeproj 后用 Xcode 15+ 打开
name: SkySense
options:
  bundleIdPrefix: com.xiaotian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 260728.2.5.23
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: "5.9"
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    DEVELOPMENT_TEAM: ""                  # 填入你的 Apple 开发者 Team ID
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# 显式定义 scheme，供 CI 上 xcodebuild -scheme 使用
schemes:
  SkySense:
    build:
      targets:
        SkySense: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  # ================= 主应用 =================
  SkySense:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotian.skysense
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SkySense.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SkySenseWidget
        embed: true

  # ================= 桌面小组件扩展 =================
  SkySenseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotian.skysense.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/SkySenseWidget.entitlements
        SKIP_INSTALL: YES
